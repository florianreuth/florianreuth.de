<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florian Reuth</title>
    <meta name="description" content="Florian Reuth — Software Developer from Germany">
    <meta name="author" content="Florian Reuth">

    <meta property="og:title" content="Florian Reuth">
    <meta property="og:description" content="Software Developer · Germany">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://florianreuth.de/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #08080e;
            color: #c9d1d9;
            padding: 24px;
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 20% 10%, rgba(99, 102, 241, 0.07) 0%, transparent 65%),
            radial-gradient(ellipse 50% 40% at 80% 90%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .card {
            max-width: 420px;
            width: 100%;
            padding: 40px 36px 32px;
            background: rgba(13, 13, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            box-shadow: 0 32px 72px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .avatar-wrap {
            margin-bottom: 20px;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(129, 140, 248, 0.35);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.08), 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            margin-bottom: 20px;
        }

        .name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .name .heart {
            color: #f472b6;
            font-style: normal;
        }

        .role {
            margin-top: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #818cf8;
            letter-spacing: 0.01em;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
            font-size: 0.8rem;
            color: #52525b;
        }

        .location i {
            font-size: 0.72rem;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 22px 0;
        }

        .about {
            font-size: 0.9rem;
            color: #8b949e;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .social-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-size: 0.865rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s;
        }

        .social-link i {
            font-size: 0.975rem;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.16);
            color: #e2e8f0;
            transform: translateY(-2px);
        }

        .social-link:focus-visible {
            outline: 2px solid rgba(129, 140, 248, 0.85);
            outline-offset: 2px;
        }

        footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #3f3f46;
        }

        footer a {
            color: #52525b;
            text-decoration: none;
            transition: color 0.15s;
        }

        footer a:hover {
            color: #71717a;
        }

        footer a:focus-visible {
            outline: 2px solid rgba(129, 140, 248, 0.85);
            outline-offset: 2px;
            border-radius: 3px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="avatar-wrap">
        <img class="avatar" src="avatar.jpg" alt="Florian Reuth">
    </div>

    <div class="header">
        <h1 class="name">Florian Reuth <span class="heart">♡</span></h1>
        <span class="location"><i class="fas fa-location-dot"></i> Germany</span>
    </div>

    <div class="divider"></div>

    <p class="about">
        High school student and part-time software engineer. I build open-source libraries used by millions of end
        users.
    </p>

    <div class="social-links">
        <a href="https://github.com/florianreuth" target="_blank" rel="noopener noreferrer" class="social-link">
            <i class="fab fa-github"></i> GitHub
        </a>
        <a href="mailto:florian@florianreuth.de" class="social-link">
            <i class="fas fa-envelope"></i> Email
        </a>
        <a href="https://ko-fi.com/florianreuth" target="_blank" rel="noopener noreferrer" class="social-link">
            <i class="fas fa-mug-hot"></i> Ko-fi
        </a>
    </div>

    <footer>
        <span>© 2024–2026 Florian Reuth</span>
        <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer">MIT License</a>
    </footer>
</div>
</body>
</html>
