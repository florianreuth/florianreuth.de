<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florian Reuth</title>

    <meta property="og:title" content="Florian Reuth">
    <meta property="og:description" content="Lead Software Developer · Student · Germany">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0c0d10;
            --ink: #f4f5f7;
            --subtle: #6b7078;
            --hairline: #26282e;
            --accent: #6d84f5;
            --heart: #f472b6;
            --column: 27rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            padding: 56px 24px 40px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .profile {
            width: 100%;
            max-width: var(--column);
            text-align: center;
        }

        .name {
            font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
            font-size: clamp(1.9rem, 8vw, 2.3rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
            animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }

        .name .heart {
            color: var(--heart);
            font-style: normal;
            font-weight: 600;
        }

        .eyebrow {
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 8px;
            margin-top: 12px;
            animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        .eyebrow .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--subtle);
        }

        .eyebrow .place {
            color: var(--subtle);
        }

        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 34px;
        }

        .link {
            --brand: var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 26px 10px 22px;
            border-radius: 18px;
            border: 1px solid var(--hairline);
            background: transparent;
            color: var(--ink);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.18s, background 0.18s, transform 0.18s;
            animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both;
        }

        .link:nth-child(2) {
            animation-delay: 0.22s;
        }

        .link:nth-child(3) {
            animation-delay: 0.28s;
        }

        .link .glyph {
            width: 1.75rem;
            height: 1.75rem;
            display: block;
            fill: var(--brand);
            transition: transform 0.18s;
        }

        .link:hover,
        .link:focus-visible {
            border-color: var(--brand);
            background: color-mix(in srgb, var(--brand) 12%, transparent);
            transform: translateY(-3px);
        }

        .link:hover .glyph,
        .link:focus-visible .glyph {
            transform: scale(1.08);
        }

        .link:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 3px;
        }

        footer {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 44px;
            font-size: 0.75rem;
            color: var(--subtle);
        }

        footer a {
            color: var(--subtle);
            text-decoration: none;
            transition: color 0.15s;
        }

        footer a:hover {
            color: var(--accent);
        }

        footer a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 3px;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .name,
            .eyebrow,
            .link {
                animation: none;
            }

            .link:hover,
            .link:focus-visible {
                transform: none;
            }

            .link:hover .glyph,
            .link:focus-visible .glyph {
                transform: none;
            }
        }
    </style>
</head>
